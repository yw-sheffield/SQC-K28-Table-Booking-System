# .github/workflows/maintenance.yml
# Daily job that (1) deletes every past booking and note, keeping only today
# and future dates, and (2) keeps a free-plan Supabase project from pausing,
# since the delete query itself counts as database activity.

name: Supabase maintenance

on:
  schedule:
    - cron: "17 3 * * *"      # every day at 03:17 UTC
  workflow_dispatch:           # lets you run it by hand from the Actions tab

jobs:
  purge-and-ping:
    runs-on: ubuntu-latest
    steps:
      - name: Delete past bookings and notes (keep today + future; also keeps the project awake)
        run: |
          CUTOFF=$(date -u +%F)   # today, in UTC — anything dated before today is removed
          echo "Deleting bookings and notes dated before $CUTOFF"
          curl -sS -X DELETE \
            "${{ secrets.SUPABASE_URL }}/rest/v1/bookings?date=lt.${CUTOFF}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Prefer: return=minimal" \
            --fail-with-body
          curl -sS -X DELETE \
            "${{ secrets.SUPABASE_URL }}/rest/v1/comments?date=lt.${CUTOFF}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Prefer: return=minimal" \
            --fail-with-body
          echo "Done."
